kind: container
metadata:
  name: Julia Container Job (Julia Job)
  version: 1.0.0
  description: "A Julia container job example. Demonstrates how to run Julia code in a containerized environment inside DH platform"
  labels:
    - "license:apache-2.0"
    - "platform:0.16"
    - "type:job"
    - "phase:utility"
name: julia-container-job
spec:
  image: julia:latest
  source:
    source: hello-julia.jl
    base64: 
---
kind: "container+job"
spec: 
  args: 
    - /shared/hello-julia.jl
  image: julia:latest
  command: ["julia"]
  working_dir: /shared
  fs_group: 1000
  run_as_user: 1000
  local_execution: false

