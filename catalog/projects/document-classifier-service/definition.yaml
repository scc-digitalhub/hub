name: document-classifier-service
kind: project
metadata:
  name: Document Classifier Service (Project)
  version: 1.0.0
  description: This project demonstrates how to train and deploy a document classification service based on the BERT model. The model is deployed as a service to assist with automated annotation and classification of official documents. It exposes an API using the "serve" task.
  labels:
    - "license:apache-2.0"
    - "platform:0.14"
    - "type:service"
    - "phase:utility"    
name: document-classifier-service
spec:
  functions:
    - kind: python
      metadata:
        name: document-serve
        labels:
          - "license:apache-2.0"
          - "platform:0.14"
          - "type:service"
          - "phase:model-serving"
          - "inference:custom"
          - "application:pa"           
      name: document-serve
      spec:
        requirements:
          - numpy==2.1.3
          - pandas==2.2.3
          - torchmetrics==1.6.0
          - transformer_engine==1.12.0
          - transformer_engine_cu12==1.12.0
          - transformers==4.46.3
          - torch==2.5.1
          - torchmetrics==1.6.0  
        python_version: PYTHON3_10
        source:
          handler: serve
          base64: 
          lang: python
          init_function: init
    - kind: python
      metadata:
        name: document-classifier-train
        labels:
          - "license:apache-2.0"
          - "domain:nlp"
          - "platform:0.14"
          - "type:job"
          - "phase:model-training"
          - "framework:pytorch"
          - "application:pa"
      name: document-classifier-train
      spec:
        python_version: PYTHON3_10
        requirements:
          - accelerate==1.1.1
          - evaluate
          - datasets==3.1.0
          - torch==2.5.1
          - torch_tensorrt==2.5.0
          - torchmetrics==1.6.0
          - torchtext==0.18.0
          - transformer_engine==1.12.0
          - transformer_engine_cu12==1.12.0
          - transformers==4.46.3
          - pandas==2.2.3
          - numpy==2.1.3
          - numpyencoder==0.3.0
          - scikit-learn==1.5.2
          - scipy==1.14.1
          - GitPython==3.1.43
          - attrs==24.2.0
          - async-timeout==5.0.1
          - aiosignal==1.3.1
          - aiohappyeyeballs==2.4.4
          - aiohttp==3.11.9
          - Unidecode==1.3.8
        source:
          handler: train
          base64: 
          lang: python
        





